name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Pull requests share one group per PR so a new push cancels the stale run;
# every other event gets its own group, since GitHub keeps one pending run per group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  test:
    # The spec bump bot force-pushes its draft PR, which is red until marked
    # ready; marking it ready (ready_for_review) runs the full suite.
    if: ${{ !(github.event.pull_request.draft && github.head_ref == 'automation/bump-spec' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `--add` on both lines, and `--get-all` to prove it. Without `--add`, the
      # second `git config` REPLACES the first rather than appending to it, so
      # only `git@github.com:` is ever rewritten and the `ssh://` form is left
      # uncovered. Nothing fails when that happens, which is why it is printed.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --get-all url."https://github.com/".insteadOf

      # Check the committed themes before prepare/build can regenerate them.
      - run: npm ci --ignore-scripts
      - run: npm run check:themes
      - run: npm run build
      - run: npm test

      # The network drift checks (battery, fence languages) run daily in
      # grammar-drift.yml: upstream moving is not a reason for a PR to fail.
      - run: npm run package
