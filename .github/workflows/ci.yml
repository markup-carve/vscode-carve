name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `--add` on both lines, and `--get-all` to prove it. Without `--add`, the
      # second `git config` REPLACES the first rather than appending to it, so
      # only `git@github.com:` is ever rewritten and the `ssh://` form is left
      # uncovered. Nothing fails when that happens, which is why it is printed.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --get-all url."https://github.com/".insteadOf

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Separate from `npm test` on purpose: this one reaches the network, so a
      # failure here means the vendored battery is stale (or GitHub is down),
      # not that the grammar is wrong. Keeping it out of the test script also
      # means a local run never needs a clone.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh
      - run: npm run package
