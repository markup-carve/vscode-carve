name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Separate from `npm test` on purpose: this one reaches the network, so a
      # failure here means the vendored battery is stale (or GitHub is down),
      # not that the grammar is wrong. Keeping it out of the test script also
      # means a local run never needs a clone.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh
      - run: npm run package
