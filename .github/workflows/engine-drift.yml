name: Engine drift

# The engine and the language server are pinned EXACTLY - today as npm versions,
# earlier as git revisions. A pin makes drift deliberate, but nothing notices
# when a pin has fallen behind - and a push-only CI reports the state of the day
# someone last touched the repo.
#
# This matters more here than in a library. The extension ships the engine
# INSIDE the .vsix, so there is no later resolution step a user could inspect:
# before the pins, two builds a day apart produced different extensions with the
# same version number, and a bug report could not be traced to an engine
# revision (#35).
#
# It reports rather than gates on lag: upstream moving is not a defect here, and
# a job that goes red for something outside the repository teaches people to
# ignore it. It DOES fail when a pin is not exact, or cannot be resolved to a
# commit on the branch it follows (main for both carve-js and carve-lsp) - a typo, a force-pushed branch, a revision
# that no longer exists - because that is a broken build waiting to happen.
# carve-js has rewritten history before: three sibling repos pinned revisions
# that a fresh clone cannot check out (carve#499).
#
# The rule is EXACTNESS, not one spelling of it. Demanding a 40-hex revision
# outlived the git dependencies and left this job red on every scheduled run
# until #202.

on:
  schedule:
    # 05:00 UTC daily, after the upstream repos have had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dep: "@markup-carve/carve"
            repo: markup-carve/carve-js
            path: carve-js
            branch: main
          - dep: "@markup-carve/carve-lsp"
            repo: markup-carve/carve-lsp
            path: carve-lsp
            branch: main
    steps:
      - uses: actions/checkout@v6

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}
          fetch-depth: 0

      - name: Compare the pin against ${{ matrix.path }} ${{ matrix.branch }}
        run: node tools/check-engine-pin.mjs '${{ matrix.dep }}' '${{ matrix.path }}' --branch '${{ matrix.branch }}'

  # The spec pin follows Carve 0.2 on main. Report the distance and the
  # option-free render-example population without gating on upstream movement.
  spec-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Check out the spec
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve
          path: carve-spec
          fetch-depth: 0

      - name: Compare the spec submodule against carve main
        run: |
          set -euo pipefail
          rev="$(git rev-parse HEAD:spec)"
          if ! git -C carve-spec cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::the spec submodule pins ${rev}, which is not a commit in markup-carve/carve"
            exit 1
          fi
          if ! git -C carve-spec merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::spec ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-spec rev-list --count "${rev}..origin/main")"
          corpus="$(git -C carve-spec show "${rev}:spec/0.2/conformance/examples.json" | python3 -c 'import json,sys; print(sum(e.get("kind") == "render" and not e.get("options") and isinstance(e.get("expected", {}).get("html"), str) for e in json.load(sys.stdin)["examples"]))' )"
          latest="$(git -C carve-spec show origin/main:spec/0.2/conformance/examples.json | python3 -c 'import json,sys; print(sum(e.get("kind") == "render" and not e.get("options") and isinstance(e.get("expected", {}).get("html"), str) for e in json.load(sys.stdin)["examples"]))' )"
          echo "spec pin: ${rev} ($(git -C carve-spec log -1 --format=%s "${rev}"))"
          echo "carve main is ${behind} commit(s) ahead; render examples ${corpus} -> ${latest}"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the spec submodule is ${behind} commit(s) behind carve main (render examples ${corpus} vs ${latest})"
          fi
