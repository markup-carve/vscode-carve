name: Release

on:
  push:
    tags:
      # NOT `v*`. That matched `vtest`, `v0.1.2-rc1`, `v-wip` and a typo like
      # `v0.12` - every one of which would have published to two marketplaces,
      # where a version number can never be reused. GitHub filter patterns
      # match the WHOLE ref, and `+` means one-or-more of the preceding
      # character, so this admits exactly vMAJOR.MINOR.PATCH and nothing else.
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A release is STARTED here. The `tag` job below creates the tag after the
  # gates and after the approval, so starting a release no longer means pushing
  # a tag by hand. Dispatched at an existing tag with no version it re-runs that
  # one instead, which a tag push cannot do: recreating a tag under the same
  # name fires no push event.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 0.1.9). Leave empty when dispatching at an existing tag.'
        required: false
        type: string

# The tag this run releases: the one that was pushed, or the one a dispatch will
# create. Every gate below reads this, so a dispatch and a tag push measure the
# same version.
env:
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}


# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
# THE GATES. None of them carries `environment:`, so none asks for an approval:
# they run first, and the `tag` job below needs all three. They used to be
# steps inside the publishing job, which sits AFTER the approval - so the
# maintainer approved a run that had verified nothing, and the first thing the
# approval bought was the tag.
jobs:
  release-notes:
    name: A release draft for this tag exists and has notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `write`, not `read`: a DRAFT release is invisible to a caller without
      # push access, so under `contents: read` the listing comes back empty and
      # this reports "no release" for a draft sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      # The notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to release without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: The draft exists and has notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $RELEASE_TAG. Write the notes first:" \
                 "gh release create $RELEASE_TAG --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $RELEASE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

  marketplace-credentials:
    name: Both marketplace credentials are present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mapped to job env because the `secrets` context is not readable from a
    # step-level `if:`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      # A missing credential FAILS, and now it fails BEFORE the tag. Checked
      # inside the publishing job it could only report a release that had
      # already been tagged and could no longer be withheld - and before #0.1.1
      # it did not even fail, it skipped the publish with the job still green,
      # so both marketplaces received nothing and the tag said otherwise.
      - name: The tokens are readable from this repository
        run: |
          missing=0
          [ -n "$VSCE_PAT" ] || { echo "::error::VSCE_PAT is not available to this repository"; missing=1; }
          [ -n "$OVSX_PAT" ] || { echo "::error::OVSX_PAT is not available to this repository"; missing=1; }
          exit $missing

  guard:
    name: The tag, the package version and the build agree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The tag is the version being published, so it is the version the
      # package must carry. The ref filter only checks the tag's SHAPE; a
      # v0.1.4 tag on a 0.1.3 manifest passed it and would have published 0.1.3
      # under the wrong name to both registries, where a version can never be
      # reused.
      - name: The tag and the package version have to agree
        run: |
          tag="${RELEASE_TAG#v}"
          declared=$(node -p "require('./package.json').version")
          echo "tag: $tag, package.json: $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json ($declared)"
            exit 1
          fi

      # Only meaningful on a dispatch that will CREATE the tag. A tag push
      # arrives with the tag already on the remote, so this would refuse every
      # run of the legacy path.
      - name: The tag does not exist yet
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG is already on the remote. A marketplace" \
                 "version number can never be reused; supersede it with a new" \
                 "version instead."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `--add` on both lines, and `--get-all` to prove it. Without `--add`, the
      # second `git config` REPLACES the first rather than appending to it, so
      # only `git@github.com:` is ever rewritten and the `ssh://` form is left
      # uncovered. Nothing fails when that happens, which is why it is printed.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --get-all url."https://github.com/".insteadOf

      - run: npm ci

      - run: npm run build

      # The same gate ci.yml runs, plus the packaging step. A release is not the
      # place to find out the extension does not compile or does not package.
      - run: npm test

      - name: Package extension
        run: npx vsce package --out vscode-carve.vsix

  publish:
    name: Build and publish extension
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The publish tokens are mapped to job env so the guard below can read them.
    # They used to gate the publish steps with `if: env.X != ''`, so a missing
    # token SKIPPED the publish and the job still went green - which is exactly
    # what happened to v0.1.1: tag pushed, release published, workflow green,
    # and neither marketplace ever received the extension. A tag that is
    # "always safe to push" is a tag that cannot tell you it shipped nothing.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back empty and the gate reports
      # "no release" for a draft that is sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `--add` on both lines, and `--get-all` to prove it. Without `--add`, the
      # second `git config` REPLACES the first rather than appending to it, so
      # only `git@github.com:` is ever rewritten and the `ssh://` form is left
      # uncovered. Nothing fails when that happens, which is why it is printed.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --get-all url."https://github.com/".insteadOf

      - run: npm ci

      - run: npm run build

      # Package once WITH dependencies. The extension is not bundled: the preview
      # imports @markup-carve/carve at runtime and the language server loads from
      # node_modules/@markup-carve/carve-lsp, so --no-dependencies would ship a
      # broken vsix. vsce omits devDependencies automatically; the webview libs
      # (mermaid/katex/highlight.js/chart.js) ship as prebuilt copies in media/.
      - name: Package extension
        run: npx vsce package --out vscode-carve.vsix

      - name: Upload the packaged vsix as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-carve-vsix
          path: vscode-carve.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath vscode-carve.vsix

      - name: Publish to Open VSX
        run: npx ovsx publish vscode-carve.vsix

      # Ask the registries rather than the exit code, and ask them for the
      # VERSION. The step this replaced asked Open VSX for an HTTP 200 on the
      # extension URL, which any previously published version satisfies - so it
      # printed "checking 0.1.4" while 0.1.3 was the only thing served, reported
      # the other marketplace it named in its own title without ever querying
      # it, and ended both branches with an echo, so no outcome could turn the
      # job red. That is the same shape as the skipped publish it was written
      # to catch.
      #
      # Both registries index asynchronously: Open VSX served a 404 for minutes
      # after the v0.1.1 publish it had already accepted, and the VS Code
      # Marketplace runs the vsix through validation before the gallery serves
      # it. So this retries for a quarter of an hour before it concludes
      # anything - and then it FAILS, because by that point the publish has
      # already happened and a red job is the only remaining way to say that
      # what a user can install is not what was tagged.
      - name: Both marketplaces actually serve this version
        run: |
          want="${RELEASE_TAG#v}"

          ovsx_served() {
            curl -sS --max-time 25 \
              "https://open-vsx.org/api/markup-carve/vscode-carve/latest" 2>/dev/null \
              | jq -r '.version // empty' 2>/dev/null || true
          }

          vsce_served() {
            curl -sS --max-time 25 -X POST \
              "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
              -H 'Accept: application/json;api-version=7.2-preview.1' \
              -H 'Content-Type: application/json' \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"markup-carve.vscode-carve"}]}],"flags":16}' \
              2>/dev/null \
              | jq -r '.results[0].extensions[0].versions[0].version // empty' 2>/dev/null || true
          }

          ovsx_seen=""
          vsce_seen=""
          for _ in $(seq 1 20); do
            if [ "$ovsx_seen" != "$want" ]; then ovsx_seen="$(ovsx_served)"; fi
            if [ "$vsce_seen" != "$want" ]; then vsce_seen="$(vsce_served)"; fi
            if [ "$ovsx_seen" = "$want" ] && [ "$vsce_seen" = "$want" ]; then
              break
            fi
            sleep 45
          done

          fail=0
          if [ "$ovsx_seen" = "$want" ]; then
            echo "Open VSX serves $want"
          else
            echo "::error::Open VSX serves ${ovsx_seen:-nothing}, expected $want"
            fail=1
          fi
          if [ "$vsce_seen" = "$want" ]; then
            echo "VS Code Marketplace serves $want"
          else
            echo "::error::VS Code Marketplace serves ${vsce_seen:-nothing}, expected $want"
            fail=1
          fi
          exit $fail

      # A registry publish is not finished until the release page exists. The
      # tag is pushed, CI publishes, the registry answers 200, and "released"
      # feels done - while `/releases` still shows a draft, so a reader has no
      # notes and no changelog for the version they just installed. Doing it
      # here rather than by hand also means the draft stops being a thing
      # someone has to remember to publish at the right moment.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed publish is not.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\" and .draft)] | first | .id // empty")"
          if [ -z "$id" ]; then
            echo "No draft release for $RELEASE_TAG; nothing to publish."
            exit 0
          fi
          # `tag_name` goes with every PATCH of a release. Omit it on a DRAFT
          # and GitHub replaces the tag with a generated `untagged-*`
          # placeholder, because a draft's tag is a string on the object rather
          # than a git ref - so the field has nothing to fall back to.
          # `-F` (not `-f`) for draft, so it is sent as a boolean.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$RELEASE_TAG" -F draft=false --jq '"published \(.tag_name)"'
          # Read it back: exit status does not tell you whether the tag survived.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"draft=\(.draft) tag=\(.tag_name)"'

  # THE TAG IS CREATED HERE, after the gates pass and after a human approves, so
  # a release can be started without a tag existing - which is the whole point:
  # creating the tag by hand was the maintainer's step.
  #
  # `needs:` is what makes the approval mean something. Without it the run
  # reached this job immediately, the reviewer was asked to approve a run that
  # had measured nothing, and the checks then ran in the publishing job on the
  # far side of the tag - where a red one can no longer withhold anything.
  #
  # This is also the ONLY job carrying `environment:`. GitHub prompts once per
  # gated job, so a second one would ask twice for one decision, and the second
  # prompt would arrive after the tag already existed.
  #
  # A tag push still works unchanged: the step finds the tag already on the
  # remote and creates nothing. The publish runs in THIS run rather than on the
  # new tag, because a ref created with github.token triggers no workflow.
  tag:
    name: Create the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, release-notes, marketplace-credentials]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Re-checked under the approval: main can move while a run waits for a
      # reviewer, and the gate measured the commit that was current then.
      - name: The tag and the package version still agree
        run: |
          tag="${RELEASE_TAG#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tag" != "$declared" ]; then
            echo "::error::package.json now declares $declared, not $tag. main moved" \
                 "while this run waited for approval, so the gate result no longer" \
                 "describes it. Re-run the workflow."
            exit 1
          fi

      - name: Create the tag unless it already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already on the remote; creating nothing."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::this run is on tag $RELEASE_TAG, which is not on the remote."
            exit 1
          fi
          # Re-checked under the approval: a tag can appear while a run waits.
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $RELEASE_TAG at $GITHUB_SHA"
