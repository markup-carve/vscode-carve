name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish extension
    runs-on: ubuntu-latest
    # The publish tokens are mapped to job env so the guard below can read them.
    # They used to gate the publish steps with `if: env.X != ''`, so a missing
    # token SKIPPED the publish and the job still went green - which is exactly
    # what happened to v0.1.1: tag pushed, release published, workflow green,
    # and neither marketplace ever received the extension. A tag that is
    # "always safe to push" is a tag that cannot tell you it shipped nothing.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      - run: npm run build

      # Package once WITH dependencies. The extension is not bundled: the preview
      # imports @markup-carve/carve at runtime and the language server loads from
      # node_modules/@markup-carve/carve-lsp, so --no-dependencies would ship a
      # broken vsix. vsce omits devDependencies automatically; the webview libs
      # (mermaid/katex/highlight.js/chart.js) ship as prebuilt copies in media/.
      - name: Package extension
        run: npx vsce package --out vscode-carve.vsix

      - name: Upload the packaged vsix as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-carve-vsix
          path: vscode-carve.vsix

      # A missing credential FAILS. Skipping it leaves a green job describing a
      # release that does not exist anywhere a user can install from.
      - name: Both marketplace credentials are present
        run: |
          missing=0
          [ -n "$VSCE_PAT" ] || { echo "::error::VSCE_PAT is not available to this repository"; missing=1; }
          [ -n "$OVSX_PAT" ] || { echo "::error::OVSX_PAT is not available to this repository"; missing=1; }
          exit $missing

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath vscode-carve.vsix

      - name: Publish to Open VSX
        run: npx ovsx publish vscode-carve.vsix

      # Ask the registries rather than the exit code. `vsce publish` can succeed
      # against a namespace that then serves nothing, and the job would still be
      # green - the same shape as the skip it replaced.
      # Open VSX serves a 404 from /api/{ns}/{ext} for MINUTES after a publish it
      # already accepted - measured on the v0.1.1 publish, where the namespace
      # listing also reported `"extensions":{}` while the search index already
      # had the extension. A single query here reports a healthy publish as a
      # failure, so this retries before it says anything.
      - name: The marketplaces actually serve this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          ovsx=000
          for _ in $(seq 1 10); do
            sleep 30
            ovsx="$(curl -sS -o /dev/null -w '%{http_code}' https://open-vsx.org/api/markup-carve/vscode-carve || echo 000)"
            [ "$ovsx" = "200" ] && break
          done
          [ "$ovsx" = "200" ] \
            && echo "Open VSX serves markup-carve.vscode-carve (checking $v)" \
            || echo "::warning::Open VSX still $ovsx after 5 minutes; it lagged on v0.1.1 too, so verify by hand rather than assuming a failed publish"

