name: Grammar drift

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `--add` on both lines, and `--get-all` to prove it. Without `--add`, the
      # second `git config` REPLACES the first rather than appending to it, so
      # only `git@github.com:` is ever rewritten and the `ssh://` form is left
      # uncovered. Nothing fails when that happens, which is why it is printed.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --get-all url."https://github.com/".insteadOf

      # The three arms below tokenize through vscode-textmate, a devDependency.
      - run: npm ci

      # One shared fetch feeds both independent answers below.
      - name: Check out carve-grammars
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-grammars
          path: carve-grammars

      # GATED: a stale declaration is bookkeeping owned by this repository.
      - name: Grammar declarations still describe upstream
        env:
          CARVE_GRAMMARS_DIR: carve-grammars
        run: node tools/check-grammar-drift.mjs declarations

      # GATED: a declaration that is well-formed by NAME can still be false about
      # the CONSTRUCT, and the arm above cannot see the difference (#200). The
      # ones false today are enumerated in tools/grammar-construct-baseline.json,
      # which can only shrink: anything false and unlisted fails here, and so
      # does a listed entry that has since become true.
      - name: Grammar declarations are true of the construct, not just the name
        if: always()
        env:
          CARVE_GRAMMARS_DIR: carve-grammars
        run: node tools/check-grammar-drift.mjs constructs

      # REPORTED: upstream moving is not a defect in this repository.
      - name: Report upstream rules without a local counterpart
        if: always()
        env:
          CARVE_GRAMMARS_DIR: carve-grammars
        run: tools/report-grammar-drift.sh
